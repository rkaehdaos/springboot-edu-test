dependencyManagement {
    imports {
        mavenBom "de.codecentric:spring-boot-admin-dependencies:${springBootAdminVersion}"
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

//test{} 와 tasks.named('test') {}의 차이
//test{}: 기본 test task 직접 구성, 선언적(평가 단계에서 해당 task 있다고 가정 -> 정의 되어 있어야 한다)
//tasks.named('test')
// - gradle 5.1 이상
// - lazy task 구성 : 실제 실행되거나 다른 task에 의해 실제로 참조 될 때까지 구성 연기
// - 빌드 성능 향상 가능, task  의존성 복잡한 대규모 유리

tasks.named('compileJava') {
    dependsOn clean
}
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}


// pmd
pmd {
    toolVersion = "7.24.0"
    consoleOutput = true
    ignoreFailures = true
    incrementalAnalysis = true
    ruleSets = []
    ruleSetFiles = files(rootProject.file(".github/pmd/ruleset.xml") as Object)
}
tasks.named('pmdMain') {
    includes = ['**/*']
//    ruleSetFiles = files(rootProject.file(".github/pmd/ruleset.xml") as Object)
}

tasks.named('pmdTest') {
    excludes = ['**/*']
}

// Spring Boot AOT 자동 생성 소스(build/generated/aotSources 등)는
// 프레임워크가 생성한 빌드 산출물이므로 PMD 분석 대상에서 제외한다.
// 태스크가 존재하지 않아도 안전하도록 matching 사용.
tasks.matching { it.name in ['pmdAot', 'pmdAotTest'] }.configureEach {
    enabled = false
}

tasks.named('test') {
    dependsOn pmdMain
    useJUnitPlatform()
    maxParallelForks = Runtime.runtime.availableProcessors()
    finalizedBy jacocoTestCoverageVerification
}
tasks.named('nativeTest') {
    dependsOn check
}
tasks.named('nativeCompile') {
    dependsOn nativeTest
}


graalvmNative {
    binaries {
        main {}
        test {
//            buildArgs.add("--parallelism=29") // Thread count, 기본값은 max
//            메모리 할당 : GRADLE이 판단해서 너무 높거나 하면 알아서 조절
//            buildArgs.add("-J-Xmx38G") // GIGA
//            buildArgs.add("-J-XX:MaxRAMPercentage=55.0") // PERCENT
        }
        configureEach {
            verbose = true
            buildArgs.add("-H:-CheckToolchain")
        }
    }
}


jacocoTestReport {
    reports { csv.setRequired(true) }
}
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule { limit { minimum = 0.8 } }
        rule {
            enabled = false // rule 비활성화 -> 해당 룰이 적용되지 않음
            element = 'CLASS'
            includes = ['com.example.spring3edutest.*'] //해당 패키지의 CLASS에 룰 적용

            limit {
                counter = 'Line'
                value = 'TOTALCOUNT'
                minimum = 0.1
                maximum = 0.5
            }
        }
    }
}